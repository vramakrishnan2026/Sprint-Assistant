<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sprint Assistant Walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="guide.css">
</head>
<body>
<div class="wrap">
  <header class="g-head">
    <div class="brand">
      <span class="brand-logo" id="logo"></span>
      <div><div class="brand-name">Sprint Assistant</div><div class="brand-sub">Walkthrough</div></div>
    </div>
    <button type="button" class="close-btn" id="close" hidden>Close</button>
  </header>
  <nav class="chapters" id="chapters" role="tablist" aria-label="Chapters"></nav>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="controls">
    <button type="button" class="ctl" id="prev" aria-label="Previous step"></button>
    <button type="button" class="ctl play" id="play" aria-label="Pause"></button>
    <button type="button" class="ctl" id="next" aria-label="Next step"></button>
    <div class="track" id="track"></div>
    <span class="counter" id="counter"></span>
    <button type="button" class="ctl" id="replay" aria-label="Restart this chapter" title="Restart this chapter"></button>
  </div>
  <p class="hint">Space to pause or play · arrow keys to step · click a chapter or a bar to jump</p>
</div>
<script src="data.js"></script>
<script src="guide.js"></script>
</body>
</html>
